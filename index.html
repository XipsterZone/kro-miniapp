<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>КРО — Проверка объекта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Фирменная тема КРО — фиксированная для всех пользователей и НЕ зависит
   от личной темы Telegram конкретного человека (света/тьмы/акцентного
   цвета). Раньше значения брались из var(--tg-theme-*, ...) — тех самых
   переменных, которые Telegram подставляет исходя из темы каждого
   пользователя; теперь это просто константы. Чтобы поменять цвета —
   меняйте значения именно здесь, больше нигде трогать не нужно. */
:root{
  --bg: #000000;
  --secondary-bg: #1c1c1e;
  --text: #ffffff;
  --hint: #8e8e93;
  --link: #8619fe;
  --accent: #8619fe;
  --accent-text: #ffffff;
  --section-bg: #1c1c1e;
  --header-bg: #000000;
  --divider: rgba(255,255,255,0.12);
  --danger: #ff453a;
  --good: #34c759;
  --card-title: #0a84ff;
  --radius: 14px;
}

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html{
  width: 100%;
  overflow-x: hidden;
}

body{
  margin:0; padding:0;
  width: 100%;
  overflow-x: hidden;
  overscroll-behavior: none; /* без "резинки" при перетягивании за края */
  touch-action: pan-y; /* разрешён только вертикальный скролл жестом, горизонтальный — запрещён */
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

/* Раньше здесь использовался position:fixed на html/body — из-за него в Telegram
   на iOS интерфейс визуально съезжал вправо (WebView Telegram применяет
   собственную трансформацию к странице, из-за чего fixed-позиционирование
   считает размеры некорректно). Вместо этого просто запрещаем горизонтальный
   скролл/перетягивание — тот же результат, без побочных эффектов. */
#app{
  width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
  padding-bottom: 24px;
  box-sizing: border-box;
}

.hidden{ display: none !important; }

.screen{ display: none; padding: 16px 16px 90px; animation: fadeIn .18s ease; }
.screen.active{ display: block; }

@keyframes fadeIn{ from{ opacity:0; transform: translateY(6px);} to{ opacity:1; transform: translateY(0);} }

.muted{ color: var(--hint); }

/* Progress bar */
.progress-wrap{
  position: sticky; top:0; z-index: 20;
  background: var(--bg);
  padding: 10px 16px 8px;
  display:flex; align-items:center; gap:10px;
  border-bottom: 1px solid var(--divider);
}
.progress-track{ flex:1; height:6px; background: var(--secondary-bg); border-radius: 4px; overflow:hidden; }
.progress-fill{ height:100%; width:0%; background: var(--accent); transition: width .25s ease; }
.progress-label{ font-size:12px; color: var(--hint); white-space:nowrap; min-width: 52px; text-align:right; }

/* Start screen */
.hero{ text-align:center; padding: 28px 8px 8px; }
.hero-emoji{ font-size: 46px; line-height:1; margin-bottom: 8px; }
.hero h1{ margin: 4px 0; font-size: 22px; }

.type-cards{ display:flex; flex-direction:column; gap:12px; margin-top: 20px; }
.type-card{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  padding: 22px 16px; border-radius: var(--radius);
  border: 1px solid var(--divider);
  background: var(--section-bg);
  cursor:pointer; font-family:inherit;
  transition: transform .1s ease, box-shadow .15s ease;
}
.type-card:active{ transform: scale(0.98); }
.type-emoji{ font-size: 34px; }
.type-title{ font-size: 17px; font-weight: 600; margin-top: 4px; color: var(--card-title); }
.type-sub{ font-size: 13px; color: var(--hint); }

.draft-banner{
  margin-top: 18px; padding: 12px 14px; border-radius: 12px;
  background: var(--secondary-bg);
  display:flex; align-items:center; justify-content:space-between; gap: 10px;
  font-size: 13px;
}
.link-btn{
  background:none; border:none; color: var(--link); font-weight:600; font-size:13px; cursor:pointer; padding:0; font-family:inherit;
}

/* Fields */
.field{ margin-bottom: 16px; overflow: hidden; }
.field label{ display:block; font-size: 13px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
.field input[type=text], .field textarea, .field select{
  width:100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--divider);
  background: var(--section-bg); color: var(--text); font-size: 15px; font-family: inherit;
}
.field textarea{ resize: vertical; }
.field select{
  appearance: none; -webkit-appearance: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path fill='%238e8e93' d='M5.5 7.5l4.5 4.5 4.5-4.5z'/></svg>");
  background-repeat: no-repeat; background-position: right 12px center; background-size: 18px;
  padding-right: 36px;
}
.field select:invalid{ color: var(--hint); }
.readonly-field .readonly-value{
  padding: 12px 14px; border-radius: 12px; background: var(--secondary-bg); color: var(--text); font-size: 15px;
}

h2{ font-size: 18px; margin: 6px 0 16px; }

/* Buttons */
.primary-btn{
  display:block; width:100%; padding: 14px; margin-top: 10px;
  background: var(--accent); color: var(--accent-text); border:none; border-radius: 14px;
  font-size: 16px; font-weight: 600; cursor:pointer; font-family: inherit;
}
.primary-btn:active{ opacity: .85; }
.primary-btn:disabled{ opacity:.45; cursor:not-allowed; }
.secondary-btn{
  display:block; width:100%; padding: 13px; margin-top: 10px;
  background: transparent; color: var(--link); border: 1px solid var(--divider); border-radius: 14px;
  font-size: 15px; font-weight: 500; cursor:pointer; font-family: inherit;
}

/* Sections / accordion */
.section-card{
  background: var(--section-bg); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden;
  border: 1px solid var(--divider);
}
.section-head{
  display:flex; align-items:center; justify-content:space-between; padding: 14px 16px; cursor:pointer;
}
.section-head-title{ font-size: 15px; font-weight: 600; }
.section-head-meta{ display:flex; align-items:center; gap: 8px; }
.section-badge{
  font-size: 12px; padding: 3px 8px; border-radius: 20px; background: var(--secondary-bg); color: var(--hint); font-weight:600;
}
.section-badge.done{ background: rgba(52,199,89,0.15); color: var(--good); }
.chevron{ transition: transform .18s ease; color: var(--hint); font-size: 13px; }
.section-card.open .chevron{ transform: rotate(180deg); }
.section-body{ display:none; padding: 0 14px 14px; }
.section-card.open .section-body{ display:block; }

.item-row{ padding: 12px 0; border-top: 1px solid var(--divider); }
.item-row:first-child{ border-top: none; }
.item-text{ font-size: 14.5px; line-height: 1.35; margin-bottom: 10px; }
.item-controls{ display:flex; align-items:center; justify-content:space-between; gap: 10px; flex-wrap: wrap; }

.eval-toggle{
  display:flex; align-items:center; gap:6px; font-size: 12.5px; color: var(--hint); cursor:pointer; user-select:none;
}
.switch{
  width: 38px; height: 22px; border-radius: 20px; background: var(--secondary-bg); position:relative; transition: background .15s ease; flex-shrink:0;
}
.switch::after{
  content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:#fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s ease;
}
.switch.on{ background: var(--good); }
.switch.on::after{ transform: translateX(16px); }

.score-group{ display:flex; gap: 6px; }
.score-btn{
  width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--divider);
  background: var(--section-bg); color: var(--text); font-size: 13px; font-weight:600; cursor:pointer; font-family: inherit;
}
.score-btn.selected{ background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.score-group.disabled .score-btn{ opacity: .35; pointer-events:none; }

.note-badge{
  font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
}

.comment-toggle{
  background:none; border:none; color: var(--hint); font-size: 18px; cursor:pointer; padding: 2px 4px; line-height:1;
}
.comment-toggle.active{ color: var(--accent); }
.comment-box{ margin-top: 8px; display:none; }
.comment-box.open{ display:block; }
.comment-box textarea{
  width:100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--divider);
  background: var(--secondary-bg); color: var(--text); font-size: 13.5px; font-family: inherit; resize: vertical;
}

.extra-comment-field{ margin-top: 8px; }

/* Review screen */
.summary-card{
  background: var(--section-bg); border-radius: var(--radius); padding: 16px; border: 1px solid var(--divider); margin-bottom: 14px;
}
.summary-row{ display:flex; justify-content:space-between; padding: 7px 0; font-size: 14px; border-top: 1px solid var(--divider); }
.summary-row:first-child{ border-top: none; }
.summary-row .val{ font-weight: 600; }
.summary-score{ font-size: 30px; font-weight: 700; text-align:center; margin: 4px 0 10px; }
.warnings{ margin-bottom: 10px; }
.warning-item{
  font-size: 13px; color: #a15c00; background: rgba(255,159,10,0.15); border-radius: 10px; padding: 9px 12px; margin-bottom: 8px;
}

/* Overlay */
.overlay{
  position: fixed; inset:0; background: rgba(0,0,0,0.45); display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 14px; color:#fff; z-index: 50;
}
.spinner{
  width: 34px; height:34px; border-radius:50%; border: 3px solid rgba(255,255,255,0.3); border-top-color: #fff; animation: spin .8s linear infinite;
}
@keyframes spin{ to{ transform: rotate(360deg); } }

.error-toast{
  position: fixed; left: 16px; right: 16px; bottom: 16px; background: var(--danger); color:#fff;
  padding: 12px 14px; border-radius: 12px; font-size: 13.5px; z-index: 60; box-shadow: 0 4px 18px rgba(0,0,0,.25);
}

/* Поля-триггеры даты/времени: обычный текстовый инпут (та же ширина, что у
   остальных полей), но не редактируется вручную — только открывает попап. */
.picker-trigger{ cursor: pointer; caret-color: transparent; }
.field input.picker-trigger-date, .field input.picker-trigger-time{
  background-repeat: no-repeat; background-position: right 14px center; background-size: 18px;
  padding-right: 40px;
}
.picker-trigger-date{
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='1.8'><rect x='3' y='5' width='18' height='16' rx='3'/><path d='M3 9h18M8 3v4M16 3v4'/></svg>");
}
.picker-trigger-time{
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='1.8'><circle cx='12' cy='12' r='9'/><path d='M12 7v5l3.5 2'/></svg>");
}

/* Всплывающие попапы (bottom sheet) для даты и времени */
.picker-overlay{
  position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 70;
  display:flex; align-items:flex-end; justify-content:center;
}
.picker-overlay.hidden{ display:none; }
.picker-sheet{
  width: 100%; max-width: 480px; background: var(--section-bg); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  max-height: 82vh; overflow-y: auto; box-sizing: border-box;
  animation: sheetUp .18s ease;
}
@keyframes sheetUp{ from{ transform: translateY(24px); opacity:0; } to{ transform: translateY(0); opacity:1; } }
.picker-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
.picker-title{ font-size: 16px; font-weight: 700; }
.picker-close{ background:none; border:none; font-size: 24px; line-height:1; color: var(--hint); cursor:pointer; padding: 4px 8px; }

/* Календарь */
.cal-nav{ display:flex; align-items:center; justify-content:space-between; margin: 6px 0 10px; }
.cal-nav button{ background: var(--secondary-bg); border:none; width:34px; height:34px; border-radius:10px; font-size:18px; color: var(--accent); cursor:pointer; }
.cal-nav button:disabled{ opacity:.3; cursor:not-allowed; }
.cal-month-label{ font-weight:700; font-size:15px; text-transform: capitalize; }
.cal-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:12px; color:var(--hint); margin-bottom:4px; }
.cal-days{ display:grid; grid-template-columns:repeat(7,1fr); grid-auto-rows: 42px; gap:2px; margin-bottom: 14px; }
.cal-day{
  border:none; border-radius:10px; background:transparent; font-size:14.5px; color:var(--text);
  cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit;
}
.cal-day.other-month{ visibility:hidden; pointer-events:none; }
.cal-day.disabled{ color: var(--hint); opacity:.35; cursor:not-allowed; }
.cal-day.today{ box-shadow: inset 0 0 0 1.5px var(--accent); font-weight:700; }
.cal-day.selected{ background: var(--accent); color: var(--accent-text); font-weight:700; }

/* Колёсико выбора времени */
.time-wheels{ position:relative; display:flex; align-items:center; justify-content:center; gap:10px; height:180px; margin: 10px 0 16px; }
.time-wheel{
  width: 72px; height: 180px; overflow-y: auto; scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch; scrollbar-width: none;
}
.time-wheel::-webkit-scrollbar{ display:none; }
.time-wheel-pad{ height: 72px; }
.time-wheel-item{
  height: 36px; display:flex; align-items:center; justify-content:center;
  font-size: 18px; color: var(--hint); scroll-snap-align:center; cursor:pointer; font-variant-numeric: tabular-nums;
}
.time-wheel-item.center{ color: var(--text); font-weight:700; font-size: 21px; }
.time-wheel-sep{ font-size: 20px; font-weight:700; color: var(--text); }
.time-wheel-highlight{
  position:absolute; top:50%; left:0; right:0; height:36px; transform: translateY(-50%);
  border-top:1px solid var(--divider); border-bottom:1px solid var(--divider); pointer-events:none;
}

</style>
</head>
<body>

<div id="app">

  <!-- Прогресс-бар (виден на экране чек-листа) -->
  <div id="progress-wrap" class="progress-wrap hidden">
    <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
    <div id="progress-label" class="progress-label">0 / 0</div>
  </div>

  <!-- ЭКРАН 1: выбор типа объекта -->
  <main id="screen-start" class="screen active">
    <div class="hero">
      <div class="hero-emoji">🕵️</div>
      <h1>Проверка КРО</h1>
      <p class="muted">Выберите тип объекта, который вы проверяете</p>
    </div>
    <div class="type-cards">
      <button class="type-card" data-type="restaurant">
        <span class="type-emoji">🍽</span>
        <span class="type-title">Ресторан</span>
        <span class="type-sub">Полный чек-лист сервиса</span>
      </button>
      <button class="type-card" data-type="foodcourt">
        <span class="type-emoji">🍔</span>
        <span class="type-title">Фудкорт</span>
        <span class="type-sub">Чек-лист кафе на фудкорте</span>
      </button>
    </div>
    <div id="draft-banner" class="draft-banner hidden">
      <span>У вас есть незавершённая проверка.</span>
      <button id="draft-resume-btn" class="link-btn">Продолжить →</button>
    </div>
  </main>

  <!-- ЭКРАН 2: данные визита -->
  <main id="screen-info" class="screen">
    <h2 id="info-title">Данные визита</h2>
    <div class="field">
      <label>Дата визита</label>
      <input type="text" class="picker-trigger picker-trigger-date" readonly inputmode="none" autocomplete="off" placeholder="ДД.ММ.ГГГГ" id="f-date" />
    </div>
    <div class="field">
      <label>Время визита</label>
      <input type="text" class="picker-trigger picker-trigger-time" readonly inputmode="none" autocomplete="off" placeholder="ЧЧ:ММ" id="f-time" />
    </div>
    <div class="field">
      <label id="f-object-label">Объект (название/адрес)</label>
      <select id="f-object" required>
        <option value="" disabled selected>— выберите объект —</option>
      </select>
    </div>
    <div class="field">
      <label>Тайный гость (ID)</label>
      <input type="text" id="f-guest-id" placeholder="Кодовое имя / ID проверяющего" />
    </div>
    <div class="field readonly-field" id="f-tguser-wrap">
      <label>Отправитель (Telegram)</label>
      <div id="f-tguser" class="readonly-value">—</div>
    </div>
    <button id="info-next-btn" class="primary-btn">Начать проверку →</button>
  </main>

  <!-- ЭКРАН 3: чек-лист по секциям -->
  <main id="screen-checklist" class="screen">
    <div id="sections-container"></div>
    <div class="field extra-comment-field">
      <label>Дополнительные комментарии</label>
      <textarea id="f-extra-comment" rows="4" placeholder="Свободный комментарий по визиту в целом"></textarea>
    </div>
    <button id="checklist-review-btn" class="primary-btn">К отправке →</button>
  </main>

  <!-- ЭКРАН 4: проверка перед отправкой -->
  <main id="screen-review" class="screen">
    <h2>Проверка перед отправкой</h2>
    <div id="review-summary" class="summary-card"></div>
    <div id="review-warnings" class="warnings"></div>
    <button id="submit-btn" class="primary-btn">Отправить отчёт</button>
    <button id="back-to-checklist-btn" class="secondary-btn">← Вернуться к чек-листу</button>
  </main>

  <!-- ЭКРАН 5: успех -->
  <main id="screen-success" class="screen">
    <div class="hero">
      <div class="hero-emoji">✅</div>
      <h1>Отчёт отправлен</h1>
      <p class="muted" id="success-text">Результаты проверки отправлены в чат КРО и на почту.</p>
    </div>
    <button id="new-check-btn" class="primary-btn">Новая проверка</button>
  </main>

  <!-- Оверлей отправки -->
  <div id="sending-overlay" class="overlay hidden">
    <div class="spinner"></div>
    <div>Отправляем отчёт…</div>
  </div>

  <!-- Тост ошибки -->
  <div id="error-toast" class="error-toast hidden"></div>

  <!-- Всплывающий календарь для даты визита -->
  <div id="date-picker-overlay" class="picker-overlay hidden">
    <div class="picker-sheet">
      <div class="picker-header">
        <div class="picker-title">Дата визита</div>
        <button type="button" class="picker-close" id="date-picker-close">×</button>
      </div>
      <div class="cal-nav">
        <button type="button" id="cal-prev">‹</button>
        <div class="cal-month-label" id="cal-month-label"></div>
        <button type="button" id="cal-next">›</button>
      </div>
      <div class="cal-weekdays">
        <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
      <button type="button" class="secondary-btn" id="cal-today-btn">Сегодня</button>
    </div>
  </div>

  <!-- Всплывающий выбор времени для времени визита -->
  <div id="time-picker-overlay" class="picker-overlay hidden">
    <div class="picker-sheet">
      <div class="picker-header">
        <div class="picker-title">Время визита</div>
        <button type="button" class="picker-close" id="time-picker-close">×</button>
      </div>
      <div class="time-wheels">
        <div class="time-wheel" id="wheel-hours"></div>
        <div class="time-wheel-sep">:</div>
        <div class="time-wheel" id="wheel-minutes"></div>
        <div class="time-wheel-highlight"></div>
      </div>
      <button type="button" class="primary-btn" id="time-picker-confirm">Готово</button>
    </div>
  </div>

</div>

<script>
// ====== НАСТРОЙКИ (заполните после деплоя Apps Script) ======
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwPYOzz8tkqShGlfpmpSwZfHF5Bzvwh6UMJmyujo2PwkPgIEiOSsWJx3cIVfaQm20QSyw/exec";
var APP_TITLE = "Проверка КРО";
// ==============================================================

const CHECKLISTS = {
  "restaurant": {
    "id": "restaurant",
    "title": "Ресторан",
    "emoji": "🍽",
    "docTitle": "Чек-лист проверки ресторана тайным гостем",
    "objectLabel": "Ресторан / адрес",
    "sections": [
      {
        "id": "r1",
        "title": "1. Этика и коммуникация",
        "items": [
          {
            "id": "r1-1",
            "text": "Отсутствие нецензурной лексики"
          },
          {
            "id": "r1-2",
            "text": "Вежливое общение персонала между собой"
          },
          {
            "id": "r1-3",
            "text": "Вежливое общение персонала с тайным гостем"
          },

  function todayISO() {
    // Локальная дата устройства (а не UTC — toISOString() мог сместить дату
    // на соседние сутки поздним вечером/ночью из-за разницы с UTC).
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function nowHHMM() {
    const d = new Date();
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }

  // ---- Дата/время: поля-триггеры + всплывающие попапы (календарь / колёсико времени) ----
  // Нативные <input type=date/time> в некоторых WebView (в т.ч. Telegram на iOS) имеют
  // свой внутренний минимальный размер, который нельзя надёжно подогнать под ширину
  // остальных полей через CSS. Поэтому визуально это обычные текстовые поля (той же
  // ширины, что и остальные), а по тапу открывается свой попап с выбором.

  function isoDateToDisplay(iso) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? m[3] + "." + m[2] + "." + m[1] : "";
  }

  function displayDateToIso(display) {
    const m = /^(\d{2})\.(\d{2})\.(\d{4})$/.exec((display || "").trim());
    if (!m) return null;
    const day = Number(m[1]), month = Number(m[2]), year = Number(m[3]);
    if (month < 1 || month > 12) return null;
    const daysInMonth = new Date(year, month, 0).getDate();
    if (day < 1 || day > daysInMonth) return null;
    return year + "-" + String(month).padStart(2, "0") + "-" + String(day).padStart(2, "0");
  }

  function isValidTimeDisplay(display) {
    const m = /^(\d{2}):(\d{2})$/.exec((display || "").trim());
    if (!m) return false;
    const h = Number(m[1]), mi = Number(m[2]);
    return h >= 0 && h <= 23 && mi >= 0 && mi <= 59;
  }

  const MONTH_NAMES = ["январь", "февраль", "март", "апрель", "май", "июнь", "июль", "август", "сентябрь", "октябрь", "ноябрь", "декабрь"];

  function todayParts() {
    const d = new Date();
    return { y: d.getFullYear(), m: d.getMonth(), day: d.getDate() };
  }

  // ---- Календарь (попап даты) ----
  const calEls = {
    overlay: document.getElementById("date-picker-overlay"),
    monthLabel: document.getElementById("cal-month-label"),
    days: document.getElementById("cal-days"),
    prevBtn: document.getElementById("cal-prev"),
    nextBtn: document.getElementById("cal-next"),
    closeBtn: document.getElementById("date-picker-close"),
    todayBtn: document.getElementById("cal-today-btn"),
  };
  let calView = todayParts(); // { y, m, day: <не используется здесь> } — текущий отображаемый месяц
  let calSelectedIso = null;

  function renderCalendar() {
    const t = todayParts();
    calEls.monthLabel.textContent = MONTH_NAMES[calView.m] + " " + calView.y;

    const isCurrentMonth = calView.y === t.y && calView.m === t.m;
    calEls.nextBtn.disabled = isCurrentMonth;

    // День недели первого числа месяца, приведённый к неделе Пн(0)..Вс(6)
    const firstDow = (new Date(calView.y, calView.m, 1).getDay() + 6) % 7;
    const daysInMonth = new Date(calView.y, calView.m + 1, 0).getDate();

    let html = "";
    for (let i = 0; i < firstDow; i++) html += '<div class="cal-day other-month"></div>';
    for (let day = 1; day <= daysInMonth; day++) {
      const iso = calView.y + "-" + String(calView.m + 1).padStart(2, "0") + "-" + String(day).padStart(2, "0");
      const isFuture = calView.y > t.y || (calView.y === t.y && (calView.m > t.m || (calView.m === t.m && day > t.day)));
      const isToday = calView.y === t.y && calView.m === t.m && day === t.day;
      const isSelected = iso === calSelectedIso;
      const cls = ["cal-day"];
      if (isFuture) cls.push("disabled");
      if (isToday) cls.push("today");
      if (isSelected) cls.push("selected");
      html += '<button type="button" class="' + cls.join(" ") + '" data-iso="' + iso + '"' + (isFuture ? " disabled" : "") + ">" + day + "</button>";
    }
    calEls.days.innerHTML = html;

    calEls.days.querySelectorAll(".cal-day:not(.disabled):not(.other-month)").forEach((btn) => {
      btn.addEventListener("click", () => {
        calSelectedIso = btn.dataset.iso;
        els.fDate.value = isoDateToDisplay(calSelectedIso);
        closeDatePicker();
      });
    });
  }

  function openDatePicker() {
    const currentIso = displayDateToIso(els.fDate.value) || todayISO();
    calSelectedIso = currentIso;
    const [y, m] = currentIso.split("-").map(Number);
    calView = { y, m: m - 1 };
    renderCalendar();
    calEls.overlay.classList.remove("hidden");
  }

  function closeDatePicker() {
    calEls.overlay.classList.add("hidden");
  }

  calEls.prevBtn.addEventListener("click", () => {
    calView.m--;
    if (calView.m < 0) { calView.m = 11; calView.y--; }
    renderCalendar();
  });
  calEls.nextBtn.addEventListener("click", () => {
    if (calEls.nextBtn.disabled) return;
    calView.m++;
    if (calView.m > 11) { calView.m = 0; calView.y++; }
    renderCalendar();
  });
  calEls.closeBtn.addEventListener("click", closeDatePicker);
  calEls.overlay.addEventListener("click", (e) => { if (e.target === calEls.overlay) closeDatePicker(); });
  calEls.todayBtn.addEventListener("click", () => {
    const t = todayParts();
    calView = { y: t.y, m: t.m };
    calSelectedIso = todayISO();
    els.fDate.value = isoDateToDisplay(calSelectedIso);
    closeDatePicker();
  });
  els.fDate.addEventListener("click", openDatePicker);

  // ---- Колёсико времени (попап времени) ----
  const timeEls = {
    overlay: document.getElementById("time-picker-overlay"),
    hoursCol: document.getElementById("wheel-hours"),
    minutesCol: document.getElementById("wheel-minutes"),
    closeBtn: document.getElementById("time-picker-close"),
    confirmBtn: document.getElementById("time-picker-confirm"),
  };
  const WHEEL_ITEM_H = 36;
  let wheelHours = null;
  let wheelMinutes = null;

  function buildWheel(container, values) {
    container.innerHTML =
      '<div class="time-wheel-pad"></div>' +
      values.map((v) => '<div class="time-wheel-item" data-value="' + v + '">' + v + "</div>").join("") +
      '<div class="time-wheel-pad"></div>';

    function currentIndex() {
      const idx = Math.round(container.scrollTop / WHEEL_ITEM_H);
      return Math.max(0, Math.min(values.length - 1, idx));
    }
    function highlightCenter() {
      const idx = currentIndex();
      container.querySelectorAll(".time-wheel-item").forEach((el, i) => el.classList.toggle("center", i === idx));
    }
    function scrollToIndex(idx, smooth) {
      container.scrollTo({ top: idx * WHEEL_ITEM_H, behavior: smooth ? "smooth" : "auto" });
    }

    let scrollTimeout;
    container.addEventListener("scroll", () => {
      highlightCenter();
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(() => scrollToIndex(currentIndex(), true), 100);
    });

    container.querySelectorAll(".time-wheel-item").forEach((el, i) => {
      el.addEventListener("click", () => {
        scrollToIndex(i, true);
        setTimeout(highlightCenter, 200);
      });
    });

    return {
      set: (value) => { scrollToIndex(Math.max(0, values.indexOf(value)), false); highlightCenter(); },
      get: () => values[currentIndex()],
    };
  }

  function openTimePicker() {
    const m = /^(\d{2}):(\d{2})$/.exec(els.fTime.value) || [null, nowHHMM().slice(0, 2), nowHHMM().slice(3, 5)];
    const hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
    const minutes = Array.from({ length: 60 }, (_, i) => String(i).padStart(2, "0"));
    wheelHours = buildWheel(timeEls.hoursCol, hours);
    wheelMinutes = buildWheel(timeEls.minutesCol, minutes);
    timeEls.overlay.classList.remove("hidden");
    // scrollTo работает только когда контейнер уже видим/имеет размеры
    requestAnimationFrame(() => {
      wheelHours.set(m[1]);
      wheelMinutes.set(m[2]);
    });
  }

  function closeTimePicker() {
    timeEls.overlay.classList.add("hidden");
  }

  timeEls.closeBtn.addEventListener("click", closeTimePicker);
  timeEls.overlay.addEventListener("click", (e) => { if (e.target === timeEls.overlay) closeTimePicker(); });
  timeEls.confirmBtn.addEventListener("click", () => {
    if (wheelHours && wheelMinutes) {
      els.fTime.value = wheelHours.get() + ":" + wheelMinutes.get();
    }
    closeTimePicker();
  });
  els.fTime.addEventListener("click", openTimePicker);

  function newState(type) {
    const def = CHECKLISTS[type];
    const answers = {};
    def.sections.forEach((sec) => {
      sec.items.forEach((item) => {
        answers[item.id] = { evaluated: true, score: null, comment: "" };
      });
    });
    return {
      type,
      date: todayISO(),
      time: nowHHMM(),
      object: "",
      guestId: "",
      answers,
      extraComment: "",
    };
  }

  function totalItems() {
    return CHECKLISTS[state.type].sections.reduce((n, s) => n + s.items.length, 0);
  }

  function filledCount() {
    let n = 0;
    Object.values(state.answers).forEach((a) => {
      if (!a.evaluated || a.score !== null) n++;
    });
    return n;
  }

  // ---------- Экраны ----------
  function showScreen(name) {
    currentScreen = name;
    document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"));
    document.getElementById("screen-" + name).classList.add("active");
    els.progressWrap.classList.toggle("hidden", name !== "checklist");
    updateBackButton();
    window.scrollTo(0, 0);
  }

  function updateBackButton() {
    if (!tg) return;
    if (currentScreen === "start") {
      tg.BackButton.hide();
    } else {
      tg.BackButton.show();
    }
  }

  function goBack() {
    if (currentScreen === "info") showScreen("start");
    else if (currentScreen === "checklist") showScreen("info");
    else if (currentScreen === "review") showScreen("checklist");
    else if (currentScreen === "success") showScreen("start");
  }

  // ---------- Экран 1: старт ----------
  function checkDrafts() {
    let found = null;
    ["restaurant", "foodcourt"].forEach((t) => {
      if (!found && localStorage.getItem(draftKey(t))) found = t;
    });
    if (found) {
      els.draftBanner.classList.remove("hidden");
      els.draftResumeBtn.onclick = () => resumeDraft(found);
    } else {
      els.draftBanner.classList.add("hidden");
    }
  }

  function resumeDraft(type) {
    try {
      const raw = localStorage.getItem(draftKey(type));
      state = JSON.parse(raw);
      openInfoScreen();
    } catch (e) {
      startNewCheck(type);
    }
  }

  function startNewCheck(type) {
    state = newState(type);
    // подставим имя пользователя Telegram, если доступно
    openInfoScreen();
  }

  function populateObjectOptions(type, selected) {
    const options = OBJECT_OPTIONS[type] || [];
    els.fObject.innerHTML =
      '<option value="" disabled' + (selected ? "" : " selected") + ">— выберите объект —</option>" +
      options
        .map((name) => '<option value="' + escapeHtml(name) + '"' + (name === selected ? " selected" : "") + ">" + escapeHtml(name) + "</option>")
        .join("");
  }

  function openInfoScreen() {
    const def = CHECKLISTS[state.type];
    els.infoTitle.textContent = "Данные визита — " + def.emoji + " " + def.title;
    els.fObjectLabel.textContent = def.objectLabel;
    els.fDate.value = isoDateToDisplay(state.date);
    els.fTime.value = state.time;
    populateObjectOptions(state.type, state.object);
    els.fGuestId.value = state.guestId;

    const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
    if (tgUser) {
      const name = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ");
      els.fTgUser.textContent = (name || "—") + (tgUser.username ? " (@" + tgUser.username + ")" : "");
    } else {
      els.fTgUser.textContent = "не определено (открыто вне Telegram)";
    }

    showScreen("info");
  }

  document.querySelectorAll(".type-card").forEach((btn) => {
    btn.addEventListener("click", () => startNewCheck(btn.dataset.type));
  });

  els.infoNextBtn.addEventListener("click", () => {
    const isoDate = displayDateToIso(els.fDate.value);
    if (!isoDate) {
      shake(els.fDate);
      showError("Введите корректную дату в формате ДД.ММ.ГГГГ");
      return;
    }
    if (!isValidTimeDisplay(els.fTime.value)) {
      shake(els.fTime);
      showError("Введите корректное время в формате ЧЧ:ММ");
      return;
    }
    state.date = isoDate;
    state.time = els.fTime.value.trim();
    state.object = els.fObject.value.trim();
    state.guestId = els.fGuestId.value.trim();
    if (!state.object) {
      shake(els.fObject);
      showError("Выберите объект проверки из списка");
      return;
    }
    saveDraft();
    renderChecklist();
    showScreen("checklist");
  });

  // ---------- Экран 3: чек-лист ----------
  function renderChecklist() {
    const def = CHECKLISTS[state.type];
    els.sectionsContainer.innerHTML = "";
    def.sections.forEach((sec, idx) => {
      const card = document.createElement("div");
      card.className = "section-card";
      card.dataset.sectionId = sec.id;
      if (openSectionId === sec.id || (openSectionId === null && idx === 0)) {
        card.classList.add("open");
        openSectionId = sec.id;
      }

      const head = document.createElement("div");
      head.className = "section-head";
      head.innerHTML =
        '<div class="section-head-title">' + escapeHtml(sec.title) + "</div>" +
        '<div class="section-head-meta"><span class="section-badge" data-badge="' + sec.id + '"></span><span class="chevron">▾</span></div>';
      head.addEventListener("click", () => toggleSection(sec.id));

      const body = document.createElement("div");
      body.className = "section-body";
      sec.items.forEach((item) => body.appendChild(renderItemRow(item)));

      card.appendChild(head);
      card.appendChild(body);
      els.sectionsContainer.appendChild(card);
      updateSectionBadge(sec);
    });
    els.fExtraComment.value = state.extraComment || "";
    updateProgress();
  }

  function toggleSection(id) {
    document.querySelectorAll(".section-card").forEach((c) => {
      if (c.dataset.sectionId === id) {
        c.classList.toggle("open");
        openSectionId = c.classList.contains("open") ? id : null;
      } else {
        c.classList.remove("open");
      }
    });
  }

  function renderItemRow(item) {
    const row = document.createElement("div");
    row.className = "item-row";
    row.dataset.itemId = item.id;
    const a = state.answers[item.id];

    const noteBadge = item.note ? '<span class="note-badge">' + escapeHtml(item.note) + "</span>" : "";

    row.innerHTML =
      '<div class="item-text">' + escapeHtml(item.text) + noteBadge + "</div>" +
      '<div class="item-controls">' +
        '<div class="eval-toggle" data-role="eval-toggle"><span class="switch ' + (a.evaluated ? "on" : "") + '" data-role="switch"></span><span>Оценивался</span></div>' +
        '<div class="score-group ' + (a.evaluated ? "" : "disabled") + '" data-role="score-group">' +
          [1, 2, 3, 4, 5].map((n) =>
            '<button type="button" class="score-btn ' + (a.score === n ? "selected" : "") + '" data-score="' + n + '">' + n + "</button>"
          ).join("") +
        "</div>" +
        '<button type="button" class="comment-toggle ' + (a.comment ? "active" : "") + '" data-role="comment-toggle">💬</button>' +
      "</div>" +
      '<div class="comment-box ' + (a.comment ? "open" : "") + '" data-role="comment-box">' +
        '<textarea rows="2" placeholder="' + (item.note ? "Например: 3 " + item.note : "Комментарий (опционально)") + '" data-role="comment-input">' + escapeHtml(a.comment || "") + "</textarea>" +
      "</div>";

    // события
    row.querySelector('[data-role="eval-toggle"]').addEventListener("click", () => {
      a.evaluated = !a.evaluated;
      const sw = row.querySelector('[data-role="switch"]');
      sw.classList.toggle("on", a.evaluated);
      row.querySelector('[data-role="score-group"]').classList.toggle("disabled", !a.evaluated);
      if (!a.evaluated) a.score = null;
      refreshAfterChange(item.id);
    });

    row.querySelectorAll(".score-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!a.evaluated) return;
        const val = Number(btn.dataset.score);
        a.score = a.score === val ? null : val;
        row.querySelectorAll(".score-btn").forEach((b) => b.classList.toggle("selected", Number(b.dataset.score) === a.score));
        refreshAfterChange(item.id);
      });
    });

    row.querySelector('[data-role="comment-toggle"]').addEventListener("click", (e) => {
      const box = row.querySelector('[data-role="comment-box"]');
      box.classList.toggle("open");
      e.currentTarget.classList.toggle("active", box.classList.contains("open"));
    });

    row.querySelector('[data-role="comment-input"]').addEventListener("input", (e) => {
      a.comment = e.target.value;
      row.querySelector('[data-role="comment-toggle"]').classList.toggle("active", !!a.comment);
      saveDraft();
    });

    return row;
  }

  function refreshAfterChange(itemId) {
    updateProgress();
    saveDraft();
    const sec = CHECKLISTS[state.type].sections.find((s) => s.items.some((i) => i.id === itemId));
    if (sec) updateSectionBadge(sec);
  }

  function updateSectionBadge(sec) {
    const el = document.querySelector('[data-badge="' + sec.id + '"]');
    if (!el) return;
    const total = sec.items.length;
    const done = sec.items.filter((i) => {
      const a = state.answers[i.id];
      return !a.evaluated || a.score !== null;
    }).length;
    el.textContent = done + "/" + total;
    el.classList.toggle("done", done === total);
  }

  function updateProgress() {
    const total = totalItems();
    const done = filledCount();
    const pct = total ? Math.round((done / total) * 100) : 0;
    els.progressFill.style.width = pct + "%";
    els.progressLabel.textContent = done + " / " + total;
  }

  els.fExtraComment.addEventListener("input", (e) => {
    state.extraComment = e.target.value;
    saveDraft();
  });

  els.checklistReviewBtn.addEventListener("click", () => {
    renderReview();
    showScreen("review");
  });

  // ---------- Экран 4: проверка перед отправкой ----------
  function computeStats() {
    const def = CHECKLISTS[state.type];
    let evaluatedCount = 0, scoredSum = 0, scoredCount = 0, skipped = 0, unscored = 0;
    def.sections.forEach((sec) => {
      sec.items.forEach((item) => {
        const a = state.answers[item.id];
        if (!a.evaluated) { skipped++; return; }
        evaluatedCount++;
        if (a.score !== null) { scoredSum += a.score; scoredCount++; }
        else unscored++;
      });
    });
    const avg = scoredCount ? (scoredSum / scoredCount) : null;
    return { evaluatedCount, scoredCount, skipped, unscored, avg, total: totalItems() };
  }

  function renderReview() {
    const def = CHECKLISTS[state.type];
    const stats = computeStats();
    els.reviewSummary.innerHTML =
      '<div class="summary-score">' + (stats.avg ? stats.avg.toFixed(2) : "—") + ' <span style="font-size:14px;color:var(--hint);font-weight:400;">средний балл</span></div>' +
      '<div class="summary-row"><span>Тип объекта</span><span class="val">' + def.emoji + " " + def.title + "</span></div>" +
      '<div class="summary-row"><span>Объект</span><span class="val">' + escapeHtml(state.object || "—") + "</span></div>" +
      '<div class="summary-row"><span>Дата / время</span><span class="val">' + isoDateToDisplay(state.date) + " " + state.time + "</span></div>" +
      '<div class="summary-row"><span>Тайный гость (ID)</span><span class="val">' + escapeHtml(state.guestId || "—") + "</span></div>" +
      '<div class="summary-row"><span>Оценено критериев</span><span class="val">' + stats.scoredCount + " / " + stats.total + "</span></div>" +
      '<div class="summary-row"><span>Не применялось</span><span class="val">' + stats.skipped + "</span></div>";

    els.reviewWarnings.innerHTML = "";
    if (stats.unscored > 0) {
      const w = document.createElement("div");
      w.className = "warning-item";
      w.textContent = "⚠️ Есть " + stats.unscored + " критерия(ев) без оценки (но отмечены «оценивался»). Можно отправить как есть или вернуться и заполнить.";
      els.reviewWarnings.appendChild(w);
    }
    if (!state.object) {
      const w = document.createElement("div");
      w.className = "warning-item";
      w.textContent = "⚠️ Не указан объект проверки.";
      els.reviewWarnings.appendChild(w);
    }
  }

  els.backToChecklistBtn.addEventListener("click", () => {
    renderChecklist();
    showScreen("checklist");
  });

  // ---------- Отправка ----------
  els.submitBtn.addEventListener("click", submitReport);

  async function submitReport() {
    els.submitBtn.disabled = true;
    els.sendingOverlay.classList.remove("hidden");
    try {
      const payload = buildPayload();

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
        // Демо-режим: Apps Script ещё не подключен — просто показываем, как это будет выглядеть
        await new Promise((r) => setTimeout(r, 700));
        clearDraft(state.type);
        els.successText.textContent = "Демо-режим: APPS_SCRIPT_URL ещё не настроен, поэтому отчёт никуда не отправлен. Настройте backend по инструкции SETUP.md.";
        showScreen("success");
        return;
      }

      // Без заголовка Content-Type: application/json, чтобы избежать CORS-preflight,
      // который Apps Script Web App не обрабатывает. Content.gs сам парсит JSON из тела.
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload),
      });
      const data = await res.json().catch(() => ({}));
      if (!data.ok) {
        throw new Error(data.error || "Сервер вернул ошибку отправки");
      }
      clearDraft(state.type);
      const parts = [];
      if (data.telegram === true) parts.push("в чат КРО");
      if (data.email === true) parts.push("на почту");
      els.successText.textContent = parts.length
        ? "Отчёт успешно отправлен: " + parts.join(" и ") + "."
        : "Отчёт сохранён в таблице, но отправка уведомлений не подтверждена. Проверьте настройки Script Properties.";
      showScreen("success");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch (err) {
      showError("Не удалось отправить отчёт: " + err.message);
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    } finally {
      els.submitBtn.disabled = false;
      els.sendingOverlay.classList.add("hidden");
    }
  }

  function buildPayload() {
    const def = CHECKLISTS[state.type];
    const sections = def.sections.map((sec) => ({
      id: sec.id,
      title: sec.title,
      items: sec.items.map((item) => ({
        id: item.id,
        text: item.text,
        note: item.note || null,
        evaluated: state.answers[item.id].evaluated,
        score: state.answers[item.id].score,
        comment: state.answers[item.id].comment || "",
      })),
    }));
    const stats = computeStats();
    return {
      type: state.type,
      typeTitle: def.title,
      docTitle: def.docTitle,
      date: state.date,
      time: state.time,
      object: state.object,
      guestId: state.guestId,
      extraComment: state.extraComment || "",
      sections,
      stats,
      tgUser: (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null,
    };
  }

  // ---------- Черновик / вспомогательное ----------
  function saveDraft() {
    if (!state) return;
    try {
      localStorage.setItem(draftKey(state.type), JSON.stringify(state));
    } catch (e) { /* ignore */ }
  }

  function clearDraft(type) {
    localStorage.removeItem(draftKey(type));
  }

  function showError(msg) {
    els.errorToast.textContent = msg;
    els.errorToast.classList.remove("hidden");
    setTimeout(() => els.errorToast.classList.add("hidden"), 4000);
  }

  function shake(el) {
    el.style.borderColor = "var(--danger, #e53935)";
    setTimeout(() => (el.style.borderColor = ""), 1200);
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  els.newCheckBtn.addEventListener("click", () => {
    openSectionId = null;
    showScreen("start");
    checkDrafts();
  });

  if (tg) {
    tg.BackButton.onClick(goBack);
  }

  // Клавиатура за собой не убирается на свайпе — если пользователь начал
  // жест прокрутки (реальный палец по экрану, не программный скролл при
  // фокусе), а в этот момент открыта клавиатура для комментария/поля —
  // убираем фокус, клавиатура скрывается сама.
  document.addEventListener(
    "touchmove",
    () => {
      const active = document.activeElement;
      if (active && (active.tagName === "TEXTAREA" || active.tagName === "INPUT")) {
        active.blur();
      }
    },
    { passive: true }
  );

  // ---------- Инициализация ----------
  function init() {
    checkDrafts();
    showScreen("start");
  }

  init();
})();

</script>
</body>
</html>
